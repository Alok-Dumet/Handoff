# Local database and captured-email inbox. Keep legacy DB names to preserve data.
# Usage: docker compose -f infra/docker-compose.yml up -d
services:
  refdata-db:
    image: postgres:17
    container_name: ${HANDOFF_DB_CONTAINER:-handoff-refdata-db}
    restart: unless-stopped
    environment:
      POSTGRES_USER: handoff
      POSTGRES_PASSWORD: handoff
      POSTGRES_DB: refdata
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - refdata-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handoff -d refdata"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: ${HANDOFF_MAIL_CONTAINER:-handoff-mailpit}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${INBOX_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_DISABLE_VERSION_CHECK: "true"
      MP_IGNORE_DUPLICATE_IDS: "true"
    volumes:
      - mailpit-data:/data

volumes:
  refdata-db-data:
  mailpit-data:
